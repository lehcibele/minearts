<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início</title>

    <link rel="stylesheet" href="src/css/reset.css">
    <link rel="stylesheet" href="/src/css/header.css">
    <link rel="stylesheet" href="/src/css/inicio.css">
</head>
<body>

    <header id="header"></header>

    <main class="main">
        <!-- SEÇÃO BANNER -->
        <section class="secao-banner">
            <div class="textos-banner">
                <h1 class="titulo-banner">Artesanato com Alma</h1>

                <p class="texto-banner">Descubra nossas peças únicas em macramê, colares e pulseiras inspiradas nas praias de Baía Formosa.</p>

                <button class="btn-encomende">Encomende Agora</button>
            </div>

            <div class="banner">
                <img src="src/img/banner.png" alt="Banner">
            </div>
        </section>

        <!-- SEÇÃO CATEGORIA EM DESTAQUE -->
        <section class="secao-categoria-destaque">
            <div class="wave-divider">
                <svg viewBox="0 0 1440 120" preserveAspectRatio="none">
                    <path
                        d="M0,10
                        C180,10 360,80 540,50
                        C720,20 900,70 1080,40
                        C1260,10 1380,50 1440,30
                        L1440,120
                        L0,120
                        Z">
                    </path>
                </svg>
            </div>

            <div class="categoria-destaque">
                <h2>Categoria em Destaque</h2>

                

            </div>
           
        </section>
    </main>

    <script src="/src/js/main.js"></script>
    
</body>
</html>
